name: CI

# Runs on every pull request and on main. On a pull request it only checks. A
# push to main whose checks all pass is handed to publish.yml, which pushes its
# image and deploys it to staging; releases come from release.yml, on version
# tags.
#
# Every check calls a Makefile target, so `make ci` locally is the same thing.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, so new advisories surface without a push

# A newer push to a pull request makes the older run moot. Every push to main
# is checked in a run of its own, which nothing waits for or cancels: waiting
# would hold the next commit's checks back until this one is deployed, and a
# waiting run is cancelled when another joins the group. publish.yml puts the
# publishing in order.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each run block is bash with -o pipefail: a pipeline fails when any command
# in it does, not only when its last one does.
defaults:
  run:
    shell: bash

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  SQLC_VERSION: 1.31.1
  # Makes the Go database tests fail, rather than skip, if the URL is missing.
  CI: "true"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
      - run: make lint
      - run: make script-test

  generate:
    name: generated code is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - run: make sqlc-check

  sql:
    name: sql (pg ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "18"] # the stated minimum and the newest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make db-test-sql

  test:
    name: test (pg ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.postgres == '18'
        with:
          name: coverage
          path: cover.out
          retention-days: 14

  test-s3:
    name: test (s3 against minio)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # MinIO's modules would otherwise land in the cache every Go job
          # restores.
          cache: false
      # MinIO no longer publishes an image anyone can pull, nor binaries, so
      # `make minio` builds it from source at the commit the Makefile pins.
      # That takes minutes; the binary is cached per commit and Go version.
      - id: minio
        run: echo "version=$(make -s minio-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/minio
          key: minio-${{ steps.minio.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}
      - run: make minio
      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup bin/minio server "$RUNNER_TEMP/minio" > "$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/minio.log"; exit 1
      - run: make test-s3
        env:
          S3_TEST_ENDPOINT: localhost:9000
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin

  e2e:
    name: end to end (curl)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The real binary, a scratch database and curl: bootstrap, then the
      # worked example from docs/schema.md §5 over the REST API.
      - run: make e2e

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: ./bin/aishie-core version
      # Proves the Dockerfile still builds. Nothing is pushed from CI.
      - run: make docker
      - run: docker run --rm aishie-core:dev version

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  # A green push to main: its image, deployed to staging. Pull requests and
  # the weekly run publish nothing. vuln does not hold it back; a new advisory
  # is for a person to weigh, and it still shows red here.
  publish:
    needs: [lint, generate, sql, test, test-s3, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    # A called workflow sees no secret its caller does not pass, and deploy.yml
    # is two calls down: see its header.
    secrets: inherit
