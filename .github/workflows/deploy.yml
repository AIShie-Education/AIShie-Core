name: Deploy

# The one place a build reaches an environment: edge, every green push to
# main (the image :edge), or stable, the releases schools run. publish.yml
# calls it for edge on every green push to main, and release.yml for edge on
# a pre-release tag. Stable is deployed by running it by hand, from the
# release's tag: that run is the decision to deploy, and the migration that
# comes with it, which README says is somebody's to make. For stable it
# takes a stable release's tag (v1.2.3) and a stable release's image (:1.2.3)
# and nothing else, whatever the plan lets the environment enforce. Those
# checks are this workflow's: the server deploys any image of this repository
# it is handed by whoever holds its key.
#
# A deploy target is a server set up with deploy/setup-server.sh
# (docs/deploying.md). Once the repository variable DEPLOY_TARGET_EDGE (or
# _STABLE) names it, the deploy job connects to it with SSH, as a user
# that can do nothing but run deploy/aishie-deploy, and hands it the image
# by digest. That script does this, in this order:
#
#   1. Back up the database, so that a migration that goes wrong, or a
#      rollback further than the release before, has somewhere to go back to.
#   2. `aishie-core migrate up` with the new image. A schema a newer release
#      already migrated is left alone, so this does not stop a rollback to the
#      release before, which a migration keeps working (CONTRIBUTING.md,
#      Migrations), but for migration 0027: rolling that back migrates down
#      first (docs/deploying.md, Rolling back). It stops here if this fails:
#      the server keeps running the old image, and the schema stays marked
#      dirty, with /healthz at 503, until someone puts it right
#      (`migrate force`, or the backup).
#   3. `aishie-core seed` with the new image, which adds the built-in presets a
#      release brings and leaves the ones already there as they are.
#   4. Replace the container with one of the new image.
#   5. Wait until GET /healthz answers status "ok" with the new version and
#      commit.
#
# Until an environment has a target, a run records the deployment in the
# environment and says which image is ready.
#
# The target, its host key and the SSH key are repository variables and a
# repository secret, one set per environment: a private repository on GitHub
# Free has no environment variables or secrets, and every plan has these. The
# job still names the environment, so whatever protection the environment has
# applies. Every workflow that calls this one passes `secrets: inherit`: a
# called workflow sees no secret its caller does not pass.
#
# Edge and stable were called staging and production before. Until a later
# release, which removes this, a setting not yet added by its new name is
# read by its old one (DEPLOY_*_STAGING, DEPLOY_*_PRODUCTION), with a warning
# that names the one to add, and an environment given by its old name is
# taken as the new one (docs/deploying.md, Settings from before the rename). GitHub's
# environments are not renamed with them: the first run for stable creates
# an environment of that name with no protection rules, unless it has been
# given production's first.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        description: The image, by digest
        type: string
        required: true
      migrations:
        description: The migrations new since the release the image is compared with (scripts/release-notes.sh)
        type: string
        default: ""
      since:
        description: The tag of that release; empty when there is none
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      # A list of its own: the form offers only environments that exist, and
      # a private repository on GitHub Free may have none. GitHub takes no
      # value that is not in it, so the old names are not: plan takes them
      # from a caller only.
      environment:
        description: Where to deploy
        type: choice
        options: [edge, stable]
        required: true
      image:
        description: "ghcr.io/aishie-education/aishie-core:TAG or @sha256:DIGEST; stable takes a release's tag, e.g. :1.2.3"
        type: string
        required: true

permissions:
  contents: read

# Each run block is bash with -o pipefail: a pipeline fails when any command
# in it does, not only when its last one does.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/aishie-education/aishie-core

jobs:
  # What is about to be deployed, said before any approval the environment
  # asks for, so that whoever approves can see it.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        name: Resolve the image to its digest
        env:
          WANT: ${{ inputs.image }}
          ENVIRONMENT: ${{ inputs.environment }}
          MIGRATIONS: ${{ inputs.migrations }}
          SINCE: ${{ inputs.since }}
        run: |
          # The old names, until a later release: the deploy job takes the
          # environment from here.
          case "$ENVIRONMENT" in
            edge | stable) ;;
            staging) echo "::warning::staging is called edge now: deploying to edge"; ENVIRONMENT=edge ;;
            production) echo "::warning::production is called stable now: deploying to stable"; ENVIRONMENT=stable ;;
            *) echo "::error::there is no environment $ENVIRONMENT: edge or stable"; exit 1 ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          case "$WANT" in
            "$IMAGE:"* | "$IMAGE@"*) ;;
            *) echo "::error::$WANT is not an image of $IMAGE"; exit 1 ;;
          esac
          # Not a build of main, nor a pre-release, nor a deploy procedure
          # from a branch: a rollback too is a release's image, run from a
          # release's tag.
          if [ "$ENVIRONMENT" = stable ]; then
            [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::stable is deployed from a release's tag, like v1.2.3, not from $GITHUB_REF_NAME"; exit 1; }
            [[ ${WANT#"$IMAGE:"} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::stable takes a release's image, like $IMAGE:1.2.3, not $WANT"; exit 1; }
          fi
          digest=$(docker buildx imagetools inspect "$WANT" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest == sha256:* ]] || { echo "::error::$WANT did not resolve to a digest"; exit 1; }
          image="$IMAGE@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          version=$(docker run --rm "$image" version)
          {
            echo "## Deploying to $ENVIRONMENT"
            echo
            echo "- image: \`$image\`"
            echo "- asked for: \`$WANT\`"
            echo "- version: \`$version\`"
            if [ -n "$MIGRATIONS" ]; then
              echo "- migrations${SINCE:+ new since $SINCE}: \`${MIGRATIONS// /\`, \`}\`"
            elif [ -n "$SINCE" ]; then
              echo "- migrations: none new since $SINCE"
            else
              echo "- migrations: see the release notes"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: plan
    runs-on: ubuntu-24.04
    # A timeout, like a cancellation, can stop a deploy half way: keep this
    # above the longest migration.
    timeout-minutes: 30
    # GitHub records the deployment here, and any protection the environment
    # has (required reviewers, allowed branches and tags) applies here.
    environment: ${{ needs.plan.outputs.environment }}
    # One deploy to an environment at a time, and never cancelled half way:
    # a migration stopped in the middle leaves the schema dirty. A deploy
    # still waiting is cancelled when a newer one for the environment comes,
    # and the run that asked for it ends as cancelled.
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          IMAGE_REF: ${{ needs.plan.outputs.image }}
          # Each setting by its own name: a secret indexed by a name made at
          # run time has every secret of the repository handed to the
          # runner. Only the environment's have a value. The _STAGING and
          # _PRODUCTION names are the ones they had before, read until a
          # later release.
          DEPLOY_TARGET_EDGE: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_TARGET_EDGE || '' }}
          DEPLOY_TARGET_STAGING: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_TARGET_STAGING || '' }}
          DEPLOY_TARGET_STABLE: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_TARGET_STABLE || '' }}
          DEPLOY_TARGET_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_TARGET_PRODUCTION || '' }}
          DEPLOY_KNOWN_HOSTS_EDGE: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_KNOWN_HOSTS_EDGE || '' }}
          DEPLOY_KNOWN_HOSTS_STAGING: ${{ needs.plan.outputs.environment == 'edge' && vars.DEPLOY_KNOWN_HOSTS_STAGING || '' }}
          DEPLOY_KNOWN_HOSTS_STABLE: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_KNOWN_HOSTS_STABLE || '' }}
          DEPLOY_KNOWN_HOSTS_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && vars.DEPLOY_KNOWN_HOSTS_PRODUCTION || '' }}
          DEPLOY_SSH_KEY_EDGE: ${{ needs.plan.outputs.environment == 'edge' && secrets.DEPLOY_SSH_KEY_EDGE || '' }}
          DEPLOY_SSH_KEY_STAGING: ${{ needs.plan.outputs.environment == 'edge' && secrets.DEPLOY_SSH_KEY_STAGING || '' }}
          DEPLOY_SSH_KEY_STABLE: ${{ needs.plan.outputs.environment == 'stable' && secrets.DEPLOY_SSH_KEY_STABLE || '' }}
          DEPLOY_SSH_KEY_PRODUCTION: ${{ needs.plan.outputs.environment == 'stable' && secrets.DEPLOY_SSH_KEY_PRODUCTION || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENVIRONMENT" = stable ]; then NAME=STABLE OLD=PRODUCTION; else NAME=EDGE OLD=STAGING; fi
          # A setting by its old name alone is taken, and said; by both, the
          # new one is.
          for setting in DEPLOY_TARGET DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do
            new=${setting}_$NAME old=${setting}_$OLD
            if [ -z "${!new}" ] && [ -n "${!old}" ]; then
              printf -v "$new" '%s' "${!old}"
              echo "::warning::$old is read by its old name: add $new, with the same value, then delete $old (docs/deploying.md, Settings from before the rename). A later release stops reading $old."
            elif [ -n "${!old}" ]; then
              echo "::notice::$new is set, and $old is no longer read: delete $old."
            fi
          done
          t=DEPLOY_TARGET_$NAME k=DEPLOY_KNOWN_HOSTS_$NAME s=DEPLOY_SSH_KEY_$NAME
          TARGET=${!t} KNOWN_HOSTS=${!k} SSH_KEY=${!s}
          if [ -z "$TARGET" ]; then
            # Half a configuration would otherwise pass as none, green.
            if [ -n "$SSH_KEY$KNOWN_HOSTS" ]; then
              echo "::error::DEPLOY_SSH_KEY_$NAME or DEPLOY_KNOWN_HOSTS_$NAME is set, but the variable DEPLOY_TARGET_$NAME is not (a secret of that name is not read)"
              exit 1
            fi
            echo "No deploy target is configured for $ENVIRONMENT (DEPLOY_TARGET_$NAME); $IMAGE_REF is ready." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A re-run of an older push's deploy keeps that run's image, and
          # would put an older build of main over a newer one.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              # Failed, not green: a job that names the environment and passes
              # would be recorded as a deployment of this older commit.
              echo "::error::This re-run is for $GITHUB_SHA, and main has moved on to $tip: not deploying an older build over a newer one. To deploy again, run Deploy with the image :edge."
              exit 1
            fi
          fi
          [ -n "$SSH_KEY" ] || { echo "::error::DEPLOY_TARGET_$NAME is set, but the secret DEPLOY_SSH_KEY_$NAME is not"; exit 1; }
          # Without the server's host key, nothing tells it from an impostor.
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::DEPLOY_TARGET_$NAME is set, but DEPLOY_KNOWN_HOSTS_$NAME is not"; exit 1; }
          # The key and host key live in a directory of their own, named on
          # the command line: ssh reads ~/.ssh from the passwd entry, not
          # from $HOME, and no ssh configuration of the runner's applies.
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          (umask 077 && printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$dir/key")
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$dir/known_hosts"
          # The server runs aishie-deploy with the image, and nothing else.
          ssh -F /dev/null -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$TARGET" "$IMAGE_REF"
          echo "Deployed $IMAGE_REF to $ENVIRONMENT ($TARGET)." >> "$GITHUB_STEP_SUMMARY"
