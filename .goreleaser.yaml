# Release binaries. Images are built by release.yml with buildx, so that they
# share the Dockerfile CI already proves builds.
version: 2

project_name: aishie-core

before:
  hooks:
    - go mod download

builds:
  - id: aishie-core
    main: ./cmd/aishie-core
    binary: aishie-core
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The same version, commit and date as the image (release.yml passes the
    # last two in), and the version as `make build` has it: v1.2.3, not 1.2.3.
    ldflags:
      - -s -w
      - -X github.com/AIShie-Education/AIShie-Core/internal/version.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
      - -X github.com/AIShie-Education/AIShie-Core/internal/version.Commit={{ or (index .Env "SHORT_COMMIT") .ShortCommit }}
      - -X github.com/AIShie-Education/AIShie-Core/internal/version.Date={{ or (index .Env "COMMIT_DATE") .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: the same commit gives the same bytes

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, docs/*.md]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - { title: "Schema — run `aishie-core migrate up` before starting this version", regexp: '(?i)migration', order: 0 }
    - { title: Changes, order: 999 }
  filters:
    exclude: ['^Merge ']

release:
  # A tag like v1.2.3-rc.1 is published as a pre-release and leaves "latest" alone.
  prerelease: auto
  header: |
    Binaries for Linux and macOS, and a multi-architecture image at
    `ghcr.io/aishie-education/aishie-core:{{ .Version }}`.

    `serve` never migrates on its own. If this version carries new migrations
    (the release workflow lists them below when it does), run
    `aishie-core migrate up` before starting it.
