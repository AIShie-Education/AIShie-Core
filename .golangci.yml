version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # unclosed HTTP response bodies
    - sqlclosecheck  # unclosed rows and statements
    - rowserrcheck   # rows.Err() never checked
    - errorlint      # errors compared with == instead of errors.Is
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    nolintlint:
      require-specific: true
  exclusions:
    generated: strict
    paths:
      - internal/db/dbq
    rules:
      # Tests and test helpers build SQL from fixed strings and ignore cleanup
      # errors freely.
      - path: (_test\.go|internal/testdb/|internal/testkit/)
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/db/dbq
