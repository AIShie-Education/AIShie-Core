# Optional. For machines without a local PostgreSQL: `make dev-db`, then
#
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/aishie?sslmode=disable
#   export TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
#
# For the S3 tests, MinIO is not here: it no longer publishes an image anyone
# can pull. `make minio` builds it from source instead; run it with
# `bin/minio server var/minio` (see `make test-s3`).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aishie
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
